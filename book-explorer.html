<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PageTurner — Discover Books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120c04; --bg2:#1a1207; --card:#201607; --card2:#2b1e0c;
  --accent:#d97706; --accent2:#fbbf24; --accent-soft:rgba(217,119,6,.14);
  --glow:0 0 26px rgba(217,119,6,.35);
  --text:#fdf6ea; --muted:#c9a878; --border:rgba(217,119,6,.22);
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:radial-gradient(1100px 550px at 80% -10%,rgba(217,119,6,.12),transparent 60%),var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
h1,h2,h3,.brand{font-family:'Fraunces',serif}
img{display:block;max-width:100%}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:10px;height:8px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:#5c3f16;border-radius:99px}

header{position:sticky;top:0;z-index:50;background:rgba(18,12,4,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.nav{max-width:1240px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;gap:14px}
.brand{font-size:1.5rem;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#d97706,#92400e);display:grid;place-items:center;box-shadow:var(--glow)}
.brand .logo svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2}
.nav .tag{margin-left:auto;font-size:.75rem;color:var(--muted);border:1px solid var(--border);padding:6px 12px;border-radius:99px}
@media(max-width:560px){.nav .tag{display:none}}

.hero{max-width:1240px;margin:0 auto;padding:44px 20px 6px;text-align:center}
.hero h1{font-size:clamp(2rem,5vw,3.3rem);letter-spacing:-1px;line-height:1.08;font-weight:700}
.hero h1 span{font-style:italic;background:linear-gradient(90deg,#fcd34d,#d97706,#fde68a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin:12px auto 0;max-width:560px}
.search-wrap{max-width:620px;margin:26px auto 0;position:relative}
.search-wrap svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted)}
#search{width:100%;padding:16px 20px 16px 50px;border-radius:99px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:1rem;outline:none;transition:.25s}
#search:focus{border-color:var(--accent);box-shadow:var(--glow)}
#search::placeholder{color:#7d6540}
.chips{max-width:1240px;margin:22px auto 0;padding:0 20px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{padding:9px 20px;border-radius:99px;border:1px solid var(--border);background:var(--card);font-size:.85rem;font-weight:600;color:var(--muted);transition:.25s;text-transform:capitalize}
.chip:hover{color:#fff;border-color:var(--accent);transform:translateY(-2px)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:var(--glow)}

.section{max-width:1240px;margin:0 auto;padding:30px 20px 0}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.section-head h2{font-size:1.35rem;letter-spacing:-.3px}
.section-head .count{color:var(--muted);font-size:.85rem;margin-left:auto}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:20px}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:14px}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .25s,box-shadow .25s;animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-6px);box-shadow:var(--glow);border-color:rgba(217,119,6,.5)}
.cover{position:relative;aspect-ratio:2/3;overflow:hidden;background:linear-gradient(160deg,#2b1e0c,#1a1207)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s,transform .4s}
.cover img.ok{opacity:1}
.card:hover .cover img{transform:scale(1.05)}
.cover .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center;color:var(--accent2)}
.cover .ph svg{width:40px;height:40px;stroke:var(--accent);fill:none;stroke-width:1.6;opacity:.7}
.cover .ph span{font-family:'Fraunces';font-size:.85rem;line-height:1.35}
.year{position:absolute;z-index:2;bottom:10px;left:10px;font-size:.7rem;font-weight:700;background:rgba(10,6,2,.78);backdrop-filter:blur(6px);padding:5px 10px;border-radius:99px;color:var(--accent2)}
.meta{padding:14px}
.meta h3{font-size:.9rem;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em;line-height:1.3}
.meta p{color:var(--muted);font-size:.78rem;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sk-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.sk{position:relative;overflow:hidden;background:var(--card2)}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);animation:shimmer 1.4s infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.sk-art{aspect-ratio:2/3}
.sk-line{height:12px;border-radius:6px;margin:14px 14px 0}
.sk-line.short{width:55%;margin-bottom:14px}

.state{text-align:center;padding:60px 20px;color:var(--muted)}
.state .icon{width:70px;height:70px;margin:0 auto 18px;border-radius:22px;background:var(--accent-soft);display:grid;place-items:center}
.state .icon svg{width:32px;height:32px;stroke:var(--accent);fill:none;stroke-width:1.8}
.state h3{color:var(--text);font-size:1.1rem;margin-bottom:8px;font-family:'Inter';font-weight:600}
.state p{font-size:.9rem;max-width:380px;margin:0 auto 20px}
.retry{padding:12px 28px;border-radius:99px;background:var(--accent);color:#fff;font-weight:600;font-size:.9rem;box-shadow:var(--glow);transition:.25s}
.retry:hover{transform:translateY(-2px);filter:brightness(1.12)}
.spinner{width:44px;height:44px;margin:0 auto 16px;border-radius:50%;border:4px solid var(--card2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(10,6,2,.8);backdrop-filter:blur(8px);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal-bg.open{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:820px;background:var(--bg2);border:1px solid var(--border);border-radius:24px;overflow:hidden;animation:pop .35s cubic-bezier(.2,.9,.3,1.2);position:relative}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.98)}}
.m-top{display:flex;gap:26px;padding:30px}
.m-cover{flex:0 0 180px}
.m-coverbox{position:relative;width:180px;aspect-ratio:2/3;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:linear-gradient(160deg,#2b1e0c,#1a1207)}
.m-coverbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.m-coverbox img.ok{opacity:1}
.m-coverbox .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;color:var(--accent2)}
.m-coverbox .ph svg{width:36px;height:36px;stroke:var(--accent);fill:none;stroke-width:1.6;opacity:.7}
.m-coverbox .ph span{font-family:'Fraunces';font-size:.85rem;line-height:1.35}
.m-info{flex:1;min-width:0}
.m-info h2{font-size:1.7rem;letter-spacing:-.5px;line-height:1.25}
.m-author{color:var(--accent2);font-weight:600;margin:8px 0 4px}
.m-year{color:var(--muted);font-size:.85rem}
.m-desc{color:#e8d5b5;font-size:.93rem;line-height:1.7;margin-top:14px;max-height:260px;overflow-y:auto;padding-right:6px}
.m-subjects{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.m-subjects span{font-size:.72rem;font-weight:600;background:var(--accent-soft);color:var(--accent2);padding:5px 12px;border-radius:99px;text-transform:capitalize}
@media(max-width:640px){.m-top{flex-direction:column}.m-cover{flex:none}.m-coverbox{width:140px}}
.m-close{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(10,6,2,.7);display:grid;place-items:center;transition:.2s;z-index:2}
.m-close:hover{background:var(--accent)}
.m-close svg{width:18px;height:18px;stroke:#fff;stroke-width:2;fill:none}

footer{margin-top:70px;border-top:1px solid var(--border);padding:28px 20px;text-align:center;color:var(--muted);font-size:.85rem}
footer .brand-mini{font-family:'Fraunces';font-weight:700;color:var(--text);font-size:1rem;margin-bottom:6px}
</style>
</head>
<body>

<header>
  <nav class="nav">
    <div class="brand"><span class="logo"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20V4H6.5A2.5 2.5 0 004 6.5v13z"/><path d="M4 19.5A2.5 2.5 0 006.5 22H20v-5"/></svg></span>PageTurner</div>
    <span class="tag">Open Library · millions of books</span>
  </nav>
</header>

<section class="hero">
  <h1>Lose yourself in<br><span>a good book.</span></h1>
  <p>Browse millions of books from the Open Library — search anything, explore subjects, open any book for details.</p>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="search" type="text" placeholder="Search books or authors — try 'Dune'…" autocomplete="off">
  </div>
  <div class="chips" id="chips"></div>
</section>

<section class="section">
  <div class="section-head"><h2 id="grid-title">Trending: Fantasy</h2><span class="count" id="grid-count"></span></div>
  <div class="grid" id="grid"></div>
  <div id="grid-state"></div>
</section>

<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal"></div>
</div>

<footer>
  <div class="brand-mini">PageTurner</div>
  Built by darkxfaizi · Data by Open Library
 &middot; <a href="https://whatsapp.com/channel/0029Vb0FDlJ96H4bfi55nK3c" target="_blank" rel="noopener" style="color:inherit">WhatsApp Channel</a></footer>

<script>
const $=s=>document.querySelector(s);
const grid=$('#grid'),gridState=$('#grid-state'),gridTitle=$('#grid-title'),gridCount=$('#grid-count');
const searchEl=$('#search'),chipsEl=$('#chips'),modalBg=$('#modal-bg'),modal=$('#modal');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bookIcon='<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20V4H6.5A2.5 2.5 0 004 6.5v13z"/><path d="M4 19.5A2.5 2.5 0 006.5 22H20v-5"/></svg>';
const SUBJECTS=['fantasy','sci-fi','mystery','romance'];
const coverUrl=id=>`https://covers.openlibrary.org/b/id/${id}-L.jpg`;

function setChips(active){
  chipsEl.innerHTML=SUBJECTS.map(s=>`<button class="chip${s===active?' active':''}" data-s="${s}">${s}</button>`).join('');
  chipsEl.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{searchEl.value='';setChips(c.dataset.s);loadSubject(c.dataset.s);});
}
function skeleton(n=12){
  gridState.innerHTML='';
  grid.innerHTML=Array.from({length:n},()=>`<div class="sk-card"><div class="sk sk-art"></div><div class="sk sk-line"></div><div class="sk sk-line short"></div></div>`).join('');
}
function showState(kind,title,msg,retry){
  grid.innerHTML='';
  const icon=kind==='error'
    ?'<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>'
    :'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>';
  gridState.innerHTML=`<div class="state"><div class="icon"><svg viewBox="0 0 24 24">${icon}</svg></div><h3>${title}</h3><p>${msg}</p>${kind==='error'?'<button class="retry">Try again</button>':''}</div>`;
  if(kind==='error'&&retry){const b=gridState.querySelector('.retry');if(b)b.onclick=retry;}
}
/* normalize search.json docs and subjects works into one shape */
function normSearch(d){return {title:d.title,author:(d.author_name||[]).join(', '),cover:d.cover_i,key:d.key,year:d.first_publish_year};}
function normWork(w){return {title:w.title,author:(w.authors||[]).map(a=>a.name).join(', '),cover:w.cover_id,key:w.key,year:w.first_publish_year};}
function render(list,title,countLabel){
  gridTitle.textContent=title;gridCount.textContent=countLabel;gridState.innerHTML='';
  grid.innerHTML=list.map(b=>`
    <div class="card" data-key="${esc(b.key)}">
      <div class="cover">
        <div class="ph">${bookIcon}<span>${esc(b.title)}</span></div>
        ${b.cover?`<img loading="lazy" src="${coverUrl(b.cover)}" alt="${esc(b.title)} cover" onload="this.classList.add('ok');this.previousElementSibling.style.display='none'" onerror="this.remove()">`:''}
        ${b.year?`<span class="year">${b.year}</span>`:''}
      </div>
      <div class="meta"><h3>${esc(b.title)}</h3><p>${esc(b.author||'Unknown author')}</p></div>
    </div>`).join('');
  grid.querySelectorAll('.card').forEach(el=>{
    el.onclick=()=>{const b=list.find(x=>x.key===el.dataset.key);if(b)openDetail(b);};
  });
}
async function loadSubject(sub){
  skeleton(12);
  try{
    const res=await fetch(`https://openlibrary.org/subjects/${sub}.json?limit=24`);
    if(!res.ok)throw 0;
    const data=await res.json();
    const list=(data.works||[]).map(normWork);
    if(!list.length){showState('empty','No books found','Try another subject or search term.');return;}
    render(list,`Trending: ${sub.charAt(0).toUpperCase()+sub.slice(1)}`,`${list.length} books`);
  }catch(e){
    showState('error','Could not load books','The Open Library did not respond. Check your connection and retry.',()=>loadSubject(sub));
  }
}
let deb=null,lastQ='';
async function doSearch(q){
  lastQ=q;skeleton(12);
  try{
    const res=await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=24`);
    if(!res.ok)throw 0;
    const data=await res.json();
    const list=(data.docs||[]).map(normSearch);
    if(!list.length){showState('empty','No books found','Try another title, author or keyword.');return;}
    render(list,`Results for "${q}"`,`${data.numFound?Number(data.numFound).toLocaleString():list.length} found`);
  }catch(e){
    showState('error','Search failed','The Open Library did not respond. Check your connection and retry.',()=>doSearch(lastQ));
  }
}
searchEl.addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(()=>{const q=searchEl.value.trim();if(q){setChips(null);doSearch(q);}},500);});

async function openDetail(b){
  modalBg.classList.add('open');document.body.style.overflow='hidden';
  modal.innerHTML=`<div class="state"><div class="spinner"></div><h3>Loading book…</h3></div>`;
  try{
    const res=await fetch(`https://openlibrary.org${b.key}.json`);
    if(!res.ok)throw 0;
    const d=await res.json();
    let desc=d.description;
    if(desc&&typeof desc==='object')desc=desc.value;
    desc=(desc||'').toString().trim();
    const subjects=(d.subjects||[]).slice(0,8);
    modal.innerHTML=`
      <button class="m-close" id="m-close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="m-top">
        <div class="m-cover"><div class="m-coverbox">
          <div class="ph">${bookIcon}<span>${esc(b.title)}</span></div>
          ${b.cover?`<img src="${coverUrl(b.cover)}" alt="${esc(b.title)} cover" onload="this.classList.add('ok');this.previousElementSibling.style.display='none'" onerror="this.remove()">`:''}
        </div></div>
        <div class="m-info">
          <h2>${esc(b.title)}</h2>
          <div class="m-author">${esc(b.author||'Unknown author')}</div>
          <div class="m-year">${b.year?'First published '+b.year:''}</div>
          <div class="m-desc">${desc?esc(desc):'No description available for this edition.'}</div>
          ${subjects.length?`<div class="m-subjects">${subjects.map(s=>`<span>${esc(s)}</span>`).join('')}</div>`:''}
        </div>
      </div>`;
    $('#m-close').onclick=closeModal;
  }catch(e){
    modal.innerHTML=`<div class="state" style="padding:60px 24px"><div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg></div><h3>Could not load details</h3><p>The book data did not arrive. Please try again.</p><button class="retry" id="m-retry">Try again</button><button class="retry" id="m-x" style="background:var(--card2);margin-left:8px;box-shadow:none">Close</button></div>`;
    $('#m-retry').onclick=()=>openDetail(b);
    $('#m-x').onclick=closeModal;
  }
}
function closeModal(){modalBg.classList.remove('open');document.body.style.overflow='';}
modalBg.addEventListener('click',e=>{if(e.target===modalBg)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

setChips('fantasy');
loadSubject('fantasy');
</script>
