<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova — AI Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04120d; --emerald:#10b981; --emerald-lt:#6ee7b7; --emerald-dk:#047857;
  --text:#ecfdf5; --muted:#8fb3a5; --faint:#54705f;
  --user-bub:linear-gradient(135deg,#10b981,#059669);
  --ai-bub:rgba(255,255,255,.055);
  --border:rgba(110,231,183,.16); --border-soft:rgba(255,255,255,.08);
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;color:var(--text);
  background:
    radial-gradient(900px 480px at 12% -5%, rgba(16,185,129,.16), transparent 60%),
    radial-gradient(800px 500px at 92% 8%, rgba(52,211,153,.1), transparent 60%),
    radial-gradient(700px 600px at 50% 112%, rgba(4,120,87,.16), transparent 60%),
    var(--bg);
  display:flex;flex-direction:column;min-height:100dvh;-webkit-font-smoothing:antialiased;
}
h1,.brand{font-family:'Space Grotesk',sans-serif}
/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:rgba(4,18,13,.75);border-bottom:1px solid var(--border-soft)}
.nav{max-width:880px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;
  background:linear-gradient(135deg,var(--emerald),var(--emerald-dk));
  box-shadow:0 6px 20px rgba(16,185,129,.4)}
.logo svg{width:22px;height:22px}
.brand{font-weight:700;font-size:1.12rem}
.brand span{background:linear-gradient(90deg,var(--emerald-lt),#a7f3d0);-webkit-background-clip:text;background-clip:text;color:transparent}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--emerald);box-shadow:0 0 10px var(--emerald);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.5}}
.clear-btn{
  display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.05);border:1px solid var(--border-soft);
  color:var(--muted);padding:8px 14px;border-radius:11px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;
}
.clear-btn:hover{color:#fda4af;border-color:rgba(244,63,94,.45);background:rgba(244,63,94,.1)}
.clear-btn svg{width:15px;height:15px}
/* ---------- chat ---------- */
.chat{flex:1;overflow-y:auto;scroll-behavior:smooth}
.chat-inner{max-width:880px;margin:0 auto;padding:26px 20px 12px;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;gap:12px;animation:rise .35s ease both;max-width:100%}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg.user{flex-direction:row-reverse}
.avatar{width:34px;height:34px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;margin-top:2px}
.msg.user .avatar{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 4px 14px rgba(16,185,129,.35)}
.msg.ai .avatar{background:rgba(16,185,129,.14);border:1px solid var(--border)}
.avatar svg{width:18px;height:18px}
.bubble{
  max-width:min(78%,640px);padding:13px 17px;border-radius:var(--radius);font-size:.96rem;line-height:1.65;
  word-wrap:break-word;position:relative;
}
.msg.user .bubble{background:var(--user-bub);color:#fff;border-bottom-right-radius:6px;
  box-shadow:0 8px 24px rgba(16,185,129,.28)}
.msg.ai .bubble{background:var(--ai-bub);border:1px solid var(--border-soft);border-bottom-left-radius:6px;backdrop-filter:blur(6px)}
.bubble p{margin:0 0 .6em}.bubble p:last-child{margin-bottom:0}
.bubble strong{color:#fff}
.bubble code{font-family:'JetBrains Mono',monospace;font-size:.85em;background:rgba(0,0,0,.4);
  border:1px solid var(--border-soft);padding:2px 7px;border-radius:6px;color:var(--emerald-lt)}
.msg-footer{display:flex;align-items:center;gap:8px;margin-top:8px}
.copy-btn{
  display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--border-soft);
  color:var(--faint);font-size:.72rem;font-weight:600;padding:5px 11px;border-radius:8px;cursor:pointer;font-family:inherit;transition:all .2s;
}
.copy-btn:hover{color:var(--emerald-lt);border-color:var(--border)}
.copy-btn svg{width:12px;height:12px}
.typing{display:inline-flex;gap:6px;padding:16px 20px}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--emerald-lt);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-4px)}}
.err-bubble{border-color:rgba(244,63,94,.4)!important;background:rgba(244,63,94,.08)!important}
.retry-btn{margin-top:10px;background:rgba(244,63,94,.14);border:1px solid rgba(244,63,94,.4);color:#fda4af;
  padding:8px 18px;border-radius:10px;font-weight:600;cursor:pointer;font-family:inherit;font-size:.85rem}
.retry-btn:hover{background:rgba(244,63,94,.25)}
/* ---------- suggestions ---------- */
.suggest{max-width:880px;margin:0 auto;padding:6px 20px 0;display:flex;gap:10px;flex-wrap:wrap}
.sug{
  border:1px solid var(--border);background:rgba(16,185,129,.07);color:var(--emerald-lt);
  padding:9px 16px;border-radius:999px;font-size:.85rem;font-weight:500;cursor:pointer;font-family:inherit;transition:all .2s;
}
.sug:hover{background:rgba(16,185,129,.16);transform:translateY(-1px);box-shadow:0 6px 16px rgba(16,185,129,.2)}
.suggest.hidden{display:none}
/* ---------- composer ---------- */
.composer-zone{position:sticky;bottom:0;background:linear-gradient(transparent,rgba(4,18,13,.9) 30%);padding:14px 0 10px}
.composer{max-width:880px;margin:0 auto;padding:0 20px}
.composer-box{
  display:flex;align-items:flex-end;gap:10px;background:rgba(255,255,255,.06);
  border:1px solid var(--border-soft);border-radius:20px;padding:10px 10px 10px 18px;transition:border-color .2s, box-shadow .2s;
}
.composer-box:focus-within{border-color:var(--emerald);box-shadow:0 0 0 3px rgba(16,185,129,.18)}
textarea#input{
  flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:inherit;font-size:.98rem;
  resize:none;max-height:150px;line-height:1.55;padding:8px 0;
}
textarea#input::placeholder{color:var(--faint)}
.send{
  width:46px;height:46px;border-radius:15px;border:none;cursor:pointer;flex-shrink:0;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--emerald),var(--emerald-dk));color:#fff;
  box-shadow:0 8px 22px rgba(16,185,129,.4);transition:transform .18s, opacity .18s;
}
.send:hover:not(:disabled){transform:translateY(-2px) scale(1.03)}
.send:disabled{opacity:.45;cursor:wait;transform:none}
.send svg{width:20px;height:20px}
.foot-note{text-align:center;color:var(--faint);font-size:.75rem;padding:8px 20px 16px}
footer.site{border-top:1px solid var(--border-soft);text-align:center;color:var(--faint);font-size:.82rem;padding:18px}
footer.site b{color:var(--emerald-lt)}
@media(max-width:640px){
  .bubble{max-width:86%}
  .status .txt{display:none}
}
</style>
</head>
<body>

<header>
  <div class="nav">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-8 8H4l2-3a8 8 0 1115-5z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg>
    </div>
    <div class="brand">Nova <span>AI Chat</span></div>
    <div class="status"><span class="dot"></span><span class="txt">Online · Free AI</span></div>
    <button class="clear-btn" id="clearBtn" title="Clear conversation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2m-8 0l1 13h8l1-13"/></svg>
      Clear
    </button>
  </div>
</header>

<div class="chat" id="chat"><div class="chat-inner" id="chatInner"></div></div>

<div class="suggest" id="suggest">
  <button class="sug">Write a short poem about the ocean</button>
  <button class="sug">Explain black holes simply</button>
  <button class="sug">Give me a 3-day workout plan</button>
</div>

<div class="composer-zone">
  <div class="composer">
    <div class="composer-box">
      <textarea id="input" rows="1" placeholder="Ask Nova anything…  (Enter to send)"></textarea>
      <button class="send" id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m0 0l-6 6m6-6l6 6"/></svg>
      </button>
    </div>
  </div>
  <div class="foot-note">Nova runs on free open AI — answers may take a few seconds.</div>
</div>

<footer class="site">Built by <b>darkxfaizi</b> &middot; <a href="https://whatsapp.com/channel/0029Vb0FDlJ96H4bfi55nK3c" target="_blank" rel="noopener" style="color:inherit">WhatsApp Channel</a></footer>

<script>
(function(){
  "use strict";
  var LS_KEY="nova_chat_v1";
  var API="https://text.pollinations.ai/openai";
  var SYSTEM="You are Nova, a helpful, friendly AI assistant. Keep answers clear and well-formatted. Use **bold** for emphasis and `code` for code terms when useful.";

  var chat=document.getElementById('chat'), inner=document.getElementById('chatInner'),
      input=document.getElementById('input'), sendBtn=document.getElementById('sendBtn'),
      suggest=document.getElementById('suggest');

  var busy=false, history=[]; // {role:'user'|'ai', text}

  var SVG_USER='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-5.5 8-5.5s6.5 1.5 8 5.5"/></svg>';
  var SVG_AI='<svg viewBox="0 0 24 24" fill="none" stroke="#6ee7b7" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>';
  var SVG_COPY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>';

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function md(src){
    var t=esc(src);
    t=t.replace(/`([^`]+)`/g,'<code>$1</code>');
    t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    t=t.replace(/^### (.*)$/gm,'<strong>$1</strong>');
    var lines=t.split('\n'), out=[], inList=false;
    lines.forEach(function(ln){
      var m=ln.match(/^\s*[-*]\s+(.*)/);
      if(m){ if(!inList){out.push('<ul style="margin:.4em 0 .4em 1.1em">');inList=true;} out.push('<li>'+m[1]+'</li>'); }
      else { if(inList){out.push('</ul>');inList=false;} out.push(ln); }
    });
    if(inList)out.push('</ul>');
    return out.join('<br>');
  }
  function scrollBottom(){ chat.scrollTop=chat.scrollHeight; }

  function addUserMsg(text){
    var d=document.createElement('div'); d.className='msg user';
    d.innerHTML='<div class="avatar">'+SVG_USER+'</div><div class="bubble">'+esc(text).replace(/\n/g,'<br>')+'</div>';
    inner.appendChild(d); scrollBottom(); return d;
  }
  function addAiShell(){
    var d=document.createElement('div'); d.className='msg ai';
    d.innerHTML='<div class="avatar">'+SVG_AI+'</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    inner.appendChild(d); scrollBottom(); return d;
  }
  function addCopyBtn(bubble, text){
    var f=document.createElement('div'); f.className='msg-footer';
    var b=document.createElement('button'); b.className='copy-btn';
    b.innerHTML=SVG_COPY+'<span>Copy</span>';
    b.addEventListener('click',function(){
      copyText(text).then(function(){ b.querySelector('span').textContent='Copied!';
        setTimeout(function(){b.querySelector('span').textContent='Copy'},1600); });
    });
    f.appendChild(b); bubble.appendChild(f);
  }
  function copyText(t){
    if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
    return new Promise(function(res){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();res()});
  }

  function typewriter(bubble, fullText, done){
    var body=document.createElement('div');
    bubble.innerHTML=''; bubble.appendChild(body);
    var i=0, n=fullText.length;
    var step=Math.max(2,Math.round(n/220)); // ~220 frames max
    var timer=setInterval(function(){
      i=Math.min(n,i+step);
      body.textContent=fullText.slice(0,i);
      scrollBottom();
      if(i>=n){clearInterval(timer);
        body.innerHTML=md(fullText);
        addCopyBtn(bubble,fullText);
        scrollBottom(); done&&done();
      }
    },14);
  }

  function save(){ try{localStorage.setItem(LS_KEY,JSON.stringify(history.slice(-40)))}catch(e){} }
  function load(){ try{return JSON.parse(localStorage.getItem(LS_KEY))||[]}catch(e){return[]} }

  function renderRestored(){
    history.forEach(function(m){
      if(m.role==='user'){addUserMsg(m.text);}
      else{var d=addAiShell();var b=d.querySelector('.bubble');b.innerHTML=md(m.text);addCopyBtn(b,m.text);}
    });
    if(history.length) suggest.classList.add('hidden');
  }

  function setBusy(on){
    busy=on; sendBtn.disabled=on; input.disabled=on;
    sendBtn.innerHTML=on?'<span class="spinner" style="width:20px;height:20px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;display:block;animation:spin .7s linear infinite"></span>'
      :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m0 0l-6 6m6-6l6 6"/></svg>';
  }
  var spinStyle=document.createElement('style');spinStyle.textContent='@keyframes spin{to{transform:rotate(360deg)}}';document.head.appendChild(spinStyle);

  function sendFlow(userText, opts){
    opts=opts||{};
    if(busy||!userText.trim())return;
    setBusy(true);
    suggest.classList.add('hidden');
    if(opts.appendUser!==false){ addUserMsg(userText); history.push({role:'user',text:userText}); }
    var shell=addAiShell(), bubble=shell.querySelector('.bubble');
    var ctrl=new AbortController(), to=setTimeout(function(){ctrl.abort()},120000);

    var msgs=[{role:'system',content:SYSTEM}];
    history.slice(-10).forEach(function(m){msgs.push({role:m.role==='user'?'user':'assistant',content:m.text})});
    if(opts.appendUser===false)msgs.push({role:'user',content:userText});

    fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,
      body:JSON.stringify({model:'openai',messages:msgs})})
    .then(function(r){clearTimeout(to);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(j){
      var txt=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
      if(!txt||!txt.trim())throw new Error('empty');
      history.push({role:'ai',text:txt.trim()}); save();
      setBusy(false);
      typewriter(bubble,txt.trim());
    })
    .catch(function(err){
      clearTimeout(to); setBusy(false);
      bubble.classList.add('err-bubble');
      bubble.innerHTML='<b>Something went wrong.</b><br><span style="font-size:.88rem;color:var(--muted)">'+
        (err&&err.name==='AbortError'?'The request timed out.':'The AI service is busy right now.')+
        '</span><br><button class="retry-btn">Retry</button>';
      bubble.querySelector('.retry-btn').addEventListener('click',function(){
        shell.remove(); sendFlow(userText,{appendUser:false});
      });
      scrollBottom();
    });
  }

  function send(){
    var v=input.value.trim(); if(!v)return;
    input.value=''; input.style.height='auto';
    sendFlow(v);
  }

  sendBtn.addEventListener('click',send);
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
  });
  input.addEventListener('input',function(){input.style.height='auto';input.style.height=Math.min(150,input.scrollHeight)+'px';});
  suggest.addEventListener('click',function(e){
    var b=e.target.closest('.sug'); if(!b||busy)return;
    sendFlow(b.textContent.trim());
  });
  document.getElementById('clearBtn').addEventListener('click',function(){
    history=[]; save(); inner.innerHTML=''; suggest.classList.remove('hidden');
    welcome();
  });

  function welcome(){
    var d=addAiShell(); var b=d.querySelector('.bubble');
    var t="Hey, I'm **Nova** — your free AI assistant. Ask me anything: explanations, ideas, plans, code help, writing… what's on your mind?";
    b.innerHTML=md(t);
  }

  history=load();
  if(history.length)renderRestored(); else welcome();
  input.focus();
})();
</script>
