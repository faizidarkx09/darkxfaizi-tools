<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaptionCraft — AI Caption Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#16060b; --rose:#f43f5e; --rose-lt:#fda4af; --rose-dk:#be123c;
  --text:#fff1f2; --muted:#c9a3ab; --faint:#7d5a61;
  --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.07);
  --border:rgba(253,164,175,.18); --border-soft:rgba(255,255,255,.08);
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter',system-ui,sans-serif;color:var(--text);
  background:
    radial-gradient(900px 500px at 12% -5%, rgba(244,63,94,.2), transparent 60%),
    radial-gradient(800px 500px at 92% 10%, rgba(251,113,133,.12), transparent 60%),
    radial-gradient(700px 600px at 50% 112%, rgba(190,18,60,.16), transparent 60%),
    var(--bg);
  min-height:100vh;-webkit-font-smoothing:antialiased;
}
h1,h2,.brand,.btn{font-family:'Space Grotesk',sans-serif}
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:rgba(22,6,11,.72);border-bottom:1px solid var(--border-soft)}
.nav{max-width:960px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;
  background:linear-gradient(135deg,var(--rose),var(--rose-dk));box-shadow:0 6px 20px rgba(244,63,94,.45)}
.logo svg{width:22px;height:22px}
.brand{font-weight:700;font-size:1.15rem}
.brand span{background:linear-gradient(90deg,var(--rose-lt),#fecdd3);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin-left:auto;font-size:.68rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--rose-lt);
  border:1px solid var(--border);padding:4px 10px;border-radius:999px;background:rgba(244,63,94,.1)}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.hero{padding:52px 0 28px;text-align:center}
.hero h1{font-size:clamp(2rem,5.5vw,3.2rem);font-weight:700;letter-spacing:-.5px;line-height:1.12}
.hero h1 .grad{background:linear-gradient(92deg,#fecdd3,#f43f5e 60%,#fb7185);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin-top:12px;max-width:540px;margin-left:auto;margin-right:auto}
.panel{background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);
  padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
label.lbl{display:block;font-size:.78rem;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:20px 0 10px}
label.lbl:first-child{margin-top:0}
input#topic{
  width:100%;background:rgba(0,0,0,.32);color:var(--text);border:1px solid var(--border-soft);
  border-radius:14px;padding:14px 16px;font-size:1rem;font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s;
}
input#topic:focus{border-color:var(--rose);box-shadow:0 0 0 3px rgba(244,63,94,.22)}
input#topic.shake{animation:shake .35s;border-color:#f43f5e}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hint{font-size:.82rem;color:var(--faint);margin-top:8px}.hint.err{color:var(--rose-lt)}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{
  border:1px solid var(--border-soft);background:rgba(255,255,255,.04);color:var(--muted);
  padding:10px 18px;border-radius:999px;font-size:.9rem;font-weight:500;cursor:pointer;font-family:inherit;transition:all .22s;
  display:inline-flex;align-items:center;gap:8px;
}
.pill svg{width:16px;height:16px}
.pill:hover{border-color:var(--rose);color:var(--text);transform:translateY(-1px)}
.pill.active{background:linear-gradient(135deg,var(--rose),var(--rose-dk));color:#fff;border-color:transparent;
  box-shadow:0 6px 18px rgba(244,63,94,.4)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:24px;
  background:linear-gradient(135deg,var(--rose-lt),var(--rose) 55%,var(--rose-dk));color:#fff;border:none;
  border-radius:14px;padding:15px 30px;font-size:1.02rem;font-weight:600;cursor:pointer;letter-spacing:.3px;
  box-shadow:0 10px 30px rgba(244,63,94,.45), inset 0 1px 0 rgba(255,255,255,.25);transition:transform .18s,box-shadow .18s,filter .18s;
}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 14px 36px rgba(244,63,94,.55)}
.btn:disabled{opacity:.65;cursor:wait}
.btn svg{width:20px;height:20px}
.spinner{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- results ---------- */
#results{margin-top:30px;display:none}
#results.show{display:block;animation:rise .45s ease both}
.res-title{font-size:1.25rem;margin:34px 0 14px;display:flex;align-items:center;gap:10px}
.res-title svg{width:20px;height:20px;color:var(--rose-lt)}
.cap-card{
  background:var(--card);border:1px solid var(--border-soft);border-radius:16px;padding:18px 20px;margin-bottom:14px;
  display:flex;gap:14px;align-items:flex-start;transition:border-color .2s,transform .2s;animation:rise .4s ease both;
}
.cap-card:hover{border-color:var(--border);transform:translateY(-2px)}
.cap-num{
  width:34px;height:34px;border-radius:11px;flex-shrink:0;display:grid;place-items:center;font-weight:700;font-size:.95rem;
  background:linear-gradient(135deg,var(--rose),var(--rose-dk));box-shadow:0 4px 14px rgba(244,63,94,.35);font-family:'Space Grotesk';
}
.cap-text{flex:1;font-size:1rem;line-height:1.65}
.copy-btn{
  flex-shrink:0;display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.05);
  border:1px solid var(--border-soft);color:var(--muted);padding:9px 15px;border-radius:11px;font-size:.82rem;
  font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;
}
.copy-btn:hover{color:var(--rose-lt);border-color:var(--rose);background:rgba(244,63,94,.12)}
.copy-btn svg{width:14px;height:14px}
.copy-btn.ok{color:#6ee7b7;border-color:rgba(16,185,129,.5)}
.tags-box{background:var(--card);border:1px solid var(--border-soft);border-radius:16px;padding:20px}
.tag-row{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0 18px}
.htag{
  background:rgba(244,63,94,.1);border:1px solid var(--border);color:var(--rose-lt);
  padding:7px 14px;border-radius:999px;font-size:.85rem;font-weight:500;cursor:pointer;transition:all .18s;font-family:inherit;
}
.htag:hover{background:rgba(244,63,94,.22);transform:translateY(-1px)}
.htag.copied{background:rgba(16,185,129,.18);border-color:rgba(16,185,129,.5);color:#6ee7b7}
/* skeletons */
.skel{border-radius:16px;margin-bottom:14px;border:1px solid var(--border-soft);overflow:hidden}
.skel .bar{height:88px;background:linear-gradient(110deg,rgba(255,255,255,.03) 35%,rgba(244,63,94,.2) 50%,rgba(255,255,255,.03) 65%);background-size:220% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-220% 0}}
/* error */
.error-box{text-align:center;padding:44px 24px;border:1.5px dashed rgba(244,63,94,.4);border-radius:var(--radius);color:var(--muted);margin-top:26px}
.error-box svg{width:44px;height:44px;color:var(--rose-lt);margin-bottom:12px}
.btn-retry{background:rgba(244,63,94,.14);border:1px solid rgba(244,63,94,.4);color:var(--rose-lt);
  padding:11px 26px;border-radius:12px;font-weight:600;cursor:pointer;font-family:inherit;font-size:.95rem;margin-top:16px}
.btn-retry:hover{background:rgba(244,63,94,.25)}
.raw-box{background:rgba(0,0,0,.3);border:1px solid var(--border-soft);border-radius:14px;padding:18px;white-space:pre-wrap;
  font-size:.92rem;line-height:1.7;color:var(--muted);margin-bottom:14px}
footer{margin-top:70px;border-top:1px solid var(--border-soft);padding:26px 20px;text-align:center;color:var(--faint);font-size:.85rem}
footer b{color:var(--rose-lt)}
@media(max-width:640px){.panel{padding:18px}.hero{padding:38px 0 22px}.cap-card{padding:14px}}
</style>
</head>
<body>

<header>
  <div class="nav">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"/><path d="M8.5 9.5h7M8.5 12.5h4.5"/></svg>
    </div>
    <div class="brand">CaptionCraft <span>AI</span></div>
    <div class="tag">Captions + Hashtags</div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Captions that <span class="grad">stop the scroll</span></h1>
    <p>Type your topic, pick a platform and tone — AI writes viral-ready captions and hashtags in seconds.</p>
  </section>

  <section class="panel">
    <label class="lbl" for="topic">What's your post about?</label>
    <input id="topic" type="text" placeholder="e.g. morning gym routine, homemade pizza, my new startup…" maxlength="120" autocomplete="off">
    <div class="hint" id="topicHint">Be specific — "sunset beach workout" beats just "workout".</div>

    <label class="lbl">Platform</label>
    <div class="pills" id="platformPills">
      <button class="pill active" data-v="TikTok">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 3c.4 2.3 1.9 3.7 4.5 3.9v3.1c-1.7 0-3.2-.5-4.5-1.4v6.6c0 3.6-2.6 6.3-6.2 6.3A6 6 0 014 15.4c0-3.4 2.7-6 6.1-6 .3 0 .7 0 1 .1v3.3c-.3-.1-.7-.2-1-.2-1.6 0-2.9 1.3-2.9 2.8s1.3 2.9 2.9 2.9c1.7 0 3-1.3 3-3.1V3z"/></svg>
        TikTok</button>
      <button class="pill" data-v="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.2" fill="currentColor" stroke="none"/></svg>
        Instagram</button>
      <button class="pill" data-v="YouTube Shorts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10.5 9.5l4.5 2.5-4.5 2.5z" fill="currentColor" stroke="none"/></svg>
        YouTube Shorts</button>
    </div>

    <label class="lbl">Tone</label>
    <div class="pills" id="tonePills">
      <button class="pill active" data-v="Funny">Funny</button>
      <button class="pill" data-v="Professional">Professional</button>
      <button class="pill" data-v="Savage">Savage</button>
      <button class="pill" data-v="Motivational">Motivational</button>
    </div>

    <button class="btn" id="genBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>
      <span id="genLabel">Generate Captions</span>
    </button>
  </section>

  <section id="results"></section>
</main>

<footer>Built by <b>darkxfaizi</b> · Powered by free open AI &middot; <a href="https://whatsapp.com/channel/0029Vb0FDlJ96H4bfi55nK3c" target="_blank" rel="noopener" style="color:inherit">WhatsApp Channel</a></footer>

<script>
(function(){
  "use strict";
  var topicEl=document.getElementById('topic'), hintEl=document.getElementById('topicHint'),
      genBtn=document.getElementById('genBtn'), genLabel=document.getElementById('genLabel'),
      results=document.getElementById('results');

  var platform="TikTok", tone="Funny", busy=false;

  function pillGroup(id, cb){
    document.getElementById(id).addEventListener('click',function(e){
      var b=e.target.closest('.pill'); if(!b)return;
      document.querySelectorAll('#'+id+' .pill').forEach(function(p){p.classList.remove('active')});
      b.classList.add('active'); cb(b.dataset.v);
    });
  }
  pillGroup('platformPills',function(v){platform=v});
  pillGroup('tonePills',function(v){tone=v});

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function copyText(t){
    if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t);
    return new Promise(function(res){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();res()});
  }
  var SVG_COPY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>';

  function setBusy(on){
    busy=on; genBtn.disabled=on;
    genLabel.innerHTML=on?'<span class="spinner"></span>&nbsp;Writing…':'Generate Captions';
    genBtn.querySelector('svg').style.display=on?'none':'';
  }

  function showSkeletons(){
    results.className='show'; results.innerHTML='';
    for(var i=0;i<3;i++){var s=document.createElement('div');s.className='skel';s.innerHTML='<div class="bar"></div>';results.appendChild(s);}
    var t=document.createElement('div');t.className='skel';t.innerHTML='<div class="bar" style="height:120px"></div>';results.appendChild(t);
  }

  function parseOutput(text){
    var captions=[], tags=[];
    var lines=text.split('\n');
    var tagLine='';
    lines.forEach(function(ln){
      var m=ln.match(/^\s*C\s?([123])\s*[:\-–—]\s*(.+)/i);
      if(m){captions[parseInt(m[1],10)-1]=m[2].replace(/\s*TAGS?:.*$/i,'').trim();return;}
      var tm=ln.match(/^\s*TAGS?\s*[:\-–—]\s*(.+)/i);
      if(tm){tagLine=tm[1];}
    });
    captions=captions.filter(Boolean);
    if(tagLine){ tags=tagLine.match(/#[\p{L}\p{N}_]+/gu)||[]; }
    if(!tags.length){ tags=text.match(/#[\p{L}\p{N}_]+/gu)||[]; tags=tags.slice(0,12); }
    // fallback: if no C1/C2/C3 labels, take first 3 meaty lines
    if(!captions.length){
      var meaty=lines.map(function(l){return l.trim()}).filter(function(l){
        return l.length>15 && !/^tags?[:\-]/i.test(l) && l.indexOf('#')===-1;
      });
      captions=meaty.slice(0,3);
    }
    tags=tags.slice(0,12);
    return {captions:captions.slice(0,3), tags:tags, raw:text};
  }

  function render(parsed){
    results.innerHTML='';
    var ok=parsed.captions.length>0;
    if(ok){
      var h=document.createElement('h2');h.className='res-title';
      h.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"/></svg>Your captions';
      results.appendChild(h);
      parsed.captions.forEach(function(c,i){
        var card=document.createElement('div');card.className='cap-card';card.style.animationDelay=(i*0.08)+'s';
        card.innerHTML='<div class="cap-num">'+(i+1)+'</div><div class="cap-text">'+esc(c)+'</div>';
        var b=document.createElement('button');b.className='copy-btn';b.innerHTML=SVG_COPY+'<span>Copy</span>';
        b.addEventListener('click',function(){
          copyText(c).then(function(){b.classList.add('ok');b.querySelector('span').textContent='Copied!';
            setTimeout(function(){b.classList.remove('ok');b.querySelector('span').textContent='Copy'},1600);});
        });
        card.appendChild(b); results.appendChild(card);
      });
    } else {
      var raw=document.createElement('div');raw.className='raw-box';raw.textContent=parsed.raw;results.appendChild(raw);
    }
    if(parsed.tags.length){
      var h2=document.createElement('h2');h2.className='res-title';
      h2.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12l-8 8-9-9V4h7z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>Hashtags';
      results.appendChild(h2);
      var box=document.createElement('div');box.className='tags-box';
      var row=document.createElement('div');row.className='tag-row';
      parsed.tags.forEach(function(t){
        var chip=document.createElement('button');chip.className='htag';chip.textContent=t;
        chip.title='Click to copy';
        chip.addEventListener('click',function(){
          copyText(t).then(function(){chip.classList.add('copied');setTimeout(function(){chip.classList.remove('copied')},1200)});
        });
        row.appendChild(chip);
      });
      box.appendChild(row);
      var all=document.createElement('button');all.className='copy-btn';all.innerHTML=SVG_COPY+'<span>Copy all hashtags</span>';
      all.addEventListener('click',function(){
        copyText(parsed.tags.join(' ')).then(function(){all.classList.add('ok');all.querySelector('span').textContent='Copied all!';
          setTimeout(function(){all.classList.remove('ok');all.querySelector('span').textContent='Copy all hashtags'},1600);});
      });
      box.appendChild(all);
      results.appendChild(box);
    }
    results.scrollIntoView({behavior:'smooth',block:'start'});
  }

  function renderError(){
    results.className='show';
    results.innerHTML='<div class="error-box">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>'+
      '<p><b>Could not reach the AI service.</b><br>Check your connection and try again.</p>'+
      '<button class="btn-retry" id="retryBtn">Retry</button></div>';
    document.getElementById('retryBtn').addEventListener('click',generate);
  }

  function generate(){
    var topic=topicEl.value.trim();
    if(!topic){
      topicEl.classList.add('shake');hintEl.textContent='Tell me what your post is about first.';hintEl.classList.add('err');
      setTimeout(function(){topicEl.classList.remove('shake')},400);topicEl.focus();return;
    }
    if(busy)return;
    hintEl.classList.remove('err');hintEl.textContent='Be specific — "sunset beach workout" beats just "workout".';
    setBusy(true); showSkeletons();

    var apiPrompt='Write 3 short catchy '+platform+' captions in a '+tone+' tone about "'+topic+'". '+
      'Keep each caption under 25 words and add 1-2 emojis max. Then write 10 relevant hashtags on one line. '+
      'Format exactly like this: C1: <caption> C2: <caption> C3: <caption> TAGS: <hashtags>';
    var ctrl=new AbortController(), to=setTimeout(function(){ctrl.abort()},90000);

    fetch('https://text.pollinations.ai/'+encodeURIComponent(apiPrompt),{signal:ctrl.signal})
      .then(function(r){clearTimeout(to);if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})
      .then(function(t){ setBusy(false); render(parseOutput(t.trim())); })
      .catch(function(){ clearTimeout(to); setBusy(false); renderError(); });
  }

  genBtn.addEventListener('click',generate);
  topicEl.addEventListener('keydown',function(e){if(e.key==='Enter')generate()});
})();
</script>
